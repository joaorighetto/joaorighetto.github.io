<!doctype html>
<!-- Modelo da imagem Open Graph (public/og.png, 1200×630). Gere de novo com: npm run og -->
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../src/styles/tokens.css">
<link rel="stylesheet" href="../../src/styles/components.css">
<style>
  @font-face { font-family: "Schibsted Grotesk"; src: url("../../public/fonts/schibsted-grotesk-latin-wght-normal.woff2") format("woff2"); font-weight: 400 900; }
  @font-face { font-family: "IBM Plex Mono"; src: url("../../public/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "IBM Plex Mono"; src: url("../../public/fonts/ibm-plex-mono-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .pf-hero { height: 630px; box-sizing: border-box; padding: 0; display: grid; place-items: center; }
  .pf-hero .pf-display { font-size: 68px; line-height: 1.04; max-width: 1000px; }
  .og-assinatura { font-weight: 700; font-size: 26px; color: var(--ink); }
  .og-assinatura span { font-family: var(--font-label); font-weight: 500; font-size: 20px; color: var(--ink-muted); margin-left: var(--space-3); }
</style>
</head>
<body>
<section class="pf-hero"><div class="pf-wrap pf-hero__inner">
  <span class="pf-overline">Python · automação · dados públicos</span>
  <h1 class="pf-display">Dados públicos coletados automaticamente e <mark class="pf-mark">conferidos com a fonte oficial</mark></h1>
  <div class="og-assinatura">João Marcos Zuñeda Righetto<span>joaorighetto.github.io</span></div>
</div></section>
</body>
</html>
