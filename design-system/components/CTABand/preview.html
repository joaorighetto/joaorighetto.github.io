<!-- @dsCard group="Faixas" height=520 subtitle="Bloco final escuro com e-mail e GitHub" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>preview</title>
<style>
.a1{fill:var(--accent)} .a2{fill:var(--accent);opacity:.55} .a3{fill:var(--accent);opacity:.28} .a4{fill:var(--accent);opacity:.12}
.ln{stroke:var(--line);fill:none;stroke-width:1} .lns{stroke:var(--line-strong);fill:none;stroke-width:1.25}
.pc{fill:var(--bg-raised)} .pa{fill:var(--bg-alt)} .ik{fill:var(--ink)} .im{fill:var(--ink-muted)} .st{stroke:var(--accent);fill:none;stroke-width:1.5}
.tx{font-family:var(--font-label);font-size:10px;fill:var(--ink-muted);letter-spacing:.04em} .txk{font-family:var(--font-label);font-size:10px;fill:var(--ink)} .txa{font-family:var(--font-label);font-size:10px;fill:var(--accent);font-weight:600}
</style></head>
<body>
<section class="pf-band pf-cta" aria-labelledby="cta-t"><div class="pf-wrap pf-cta__inner">
<span class="pf-overline">Contato</span>
<h2 class="pf-h2" id="cta-t">Precisa de dado público <span class="pf-hl">conferido?</span></h2>
<p>Respondo por e-mail. O código dos projetos está no GitHub.</p>
<div class="pf-contact">
<div class="pf-contact__row"><svg class="pf-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 7l8.5 6 8.5-6"/></svg><span class="pf-contact__val" id="mail">joao@exemplo.com.br</span><button class="pf-btn pf-btn--band" type="button" id="copy"><svg class="pf-icon pf-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg><span>Copiar e-mail</span></button></div>
<div class="pf-contact__row"><svg class="pf-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8l-4 4 4 4"/><path d="M16 8l4 4-4 4"/><path d="M13.5 5l-3 14"/></svg><a class="pf-contact__val" href="https://github.com/">github.com/[usuario]</a><svg class="pf-icon pf-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></div>
</div>
<span class="pf-seal pf-seal--band"><span class="pf-seal__icon"><svg class="pf-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span><span class="pf-seal__label">Conferido com a fonte oficial</span></span>
<span class="pf-muted" role="status" id="copy-st" style="font-size:14px;color:var(--band-muted)"></span>
</div></section>
<script>var b=document.getElementById('copy'),m=document.getElementById('mail'),st=document.getElementById('copy-st');b.addEventListener('click',function(){var done=function(){b.querySelector('span').textContent='Copiado';st.textContent='E-mail copiado para a área de transferência.';setTimeout(function(){b.querySelector('span').textContent='Copiar e-mail';},2000)};var fail=function(){var r=document.createRange();r.selectNodeContents(m);var s=getSelection();s.removeAllRanges();s.addRange(r);st.textContent='E-mail selecionado. Use Ctrl+C para copiar.'};try{navigator.clipboard.writeText(m.textContent).then(done,fail)}catch(e){fail()}});</script>
</body>
</html>
